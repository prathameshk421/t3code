version: 1
workflow: default
approvers: { default: [approver, tester, discord_rush, telegram_owner, mattermost_owner, slack_owner], core: [approver, tester, discord_rush, telegram_owner, mattermost_owner, slack_owner] }
policy_owners: [approver, discord_rush, telegram_owner, mattermost_owner, slack_owner]
people:
  author:   { github: aarush323, chat: dev-author, teams: [core] }
  approver: { github: temporaryhameshakagroup-alt, chat: "@switch-discord-35755c56-ff93-43ac-a7a3-3e46afa3c3a0-prathameshk421:localhost", teams: [core] }
  discord_rush: { github: placeholder-discord-rush, chat: "@switch-discord-35755c56-ff93-43ac-a7a3-3e46afa3c3a0-rush32306:localhost", teams: [core] }
  telegram_owner: { github: placeholder-telegram-owner, chat: "@switch-telegram-ff4ccbe3-420c-4ca7-b852-d064a463032f-adumbstudent:localhost", teams: [core] }
  mattermost_owner: { github: placeholder-mattermost-owner, chat: "@switch-mattermost-d5d5d493-5875-43a3-ac00-c55ffc9a22f0-dev-approver:localhost", teams: [core] }
  slack_owner: { github: placeholder-slack-owner, chat: "@switch-slack-44cfe58c-8c5b-455e-a4ac-e5f93a8a8bf0-benzene276:localhost", teams: [core] }
  tester:   { github: rekdfr, teams: [core] }
  bob:      { chat: rev-backend, seat: reviewer-1, teams: [core] }
  eli:      { chat: rev-frontend, seat: reviewer-2, teams: [core] }
  ana:      { github: prathameshk421, chat: rev-infra, seat: reviewer-3, teams: [security] }
seats:
  reviewer-1: {role: dev,      lenses: [correctness, contract, tests]}
  reviewer-2: {role: security, lenses: [security, data]}
  reviewer-3: {role: infra,    lenses: [infra, operability]}
domains: { "packages/shared/**": core }
reviewers: { count: 3, pick_timeout: 15m }
slop: { max_changed_lines: 400, require_ticket: false, ignore: ["pnpm-lock.yaml"] }
tests:
  dir: tests/heimdall
  allowed_imports: [vitest]
  sensitive: ["**/auth/**"]
  min_mutation_score: 0.6
  mutation_blocks: false
blocking: { min_severity: medium, min_tier: E3 }
consensus: { min_high_reporters: 2, block_score: 1.5, min_reporters: majority, confidence: { high: 1.0, medium: 0.5, low: 0.2 }, weight: { start: 0.7, min: 0.3, max: 1.0, min_decided: 5 } }
deliberation: { max_rounds: 2, human_only_domains: [] }
keys: { openrouter: production }
models: { provider: openrouter, test_author: openrouter/deepseek/deepseek-v4-flash, reviewer: openrouter/deepseek/deepseek-v4-flash, resolver: openrouter/deepseek/deepseek-v4-flash, extraction: deepseek/deepseek-v4-flash, embedding: "openrouter:mongodb/voyage-4-lite" }
budgets: { test_author: 400000, reviewer: 150000, resolver: 120000, per_change: 1200000 }
skills: { test_author: "1.0.0", reviewer: "1.0.0", resolver: "1.0.0" }
memory: { rooms: [t3code-eng], chat_keywords: [decided, decision, "we will", incident, postmortem] }
pack: { max_age_days: 14 }
timeouts: { question: 4h, remind_after: 2h, escalate_after: 8h, reject_after: 24h }
ci_required: []
chat: { bridge: mattermost, verbosity: milestones, decisions_in_room: true }
github: { mode: poll, interval: 10s }
tracker: { kind: jira, mode: poll, interval: 30s }
agents: { runtime: opencode }
